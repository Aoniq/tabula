name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install native client libraries
        run: brew install postgresql@17 mariadb-connector-c
      - name: Build (debug)
        run: swift build
      - name: Build app bundle (release)
        run: scripts/build-app.sh
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Tabula.app
          path: build/Tabula.app
